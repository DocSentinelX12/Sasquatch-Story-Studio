<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sasquatch Story Studio</title>
  <meta name="description" content="Production hub for the Sasquatch animated series — story, episodes, scenes, shots, assets and generation." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238fd19b' stroke-width='2'%3E%3Cpath d='M3 21c2-8 5-12 9-12s7 4 9 12'/%3E%3Ccircle cx='12' cy='6' r='2.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 21c2-8 5-12 9-12s7 4 9 12"/><circle cx="12" cy="6" r="2.5"/>
          </svg>
        </div>
        <div>
          <h1>Sasquatch Story Studio</h1>
          <div class="sub">Animation Production</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot">
        <span class="dot" style="background:var(--moss)"></span>Studio offline-ready
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn ghost small" id="nav-toggle" style="display:none" aria-label="Toggle navigation">☰</button>
        <div class="crumb" id="crumb"><b>Dashboard</b></div>
        <div class="spacer"></div>
        <div class="project-pick" id="project-pick"></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
