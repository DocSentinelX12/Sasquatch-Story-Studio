name: Install CogVideoX1.5 I2V

on:
  push:
    branches: [main]
    paths:
      - "scripts/install_cogvideox15_i2v.py"
      - "studio/cogvideox15_i2v_runtime.py"
      - ".github/workflows/install-cogvideox15-i2v.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify source integration
        run: python scripts/install_cogvideox15_i2v.py
      - name: Upload installation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cogvideox1-5-5b-i2v-installation-evidence
          path: engine-installations/cogvideox1.5-5b-i2v/installation-evidence.json
