name: GPU Verification Contract Tests

on:
  push:
    branches:
      - gpu-capability-architecture

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run GPU verification contract tests
        run: python -m pytest -q tests/test_gpu_runtime_verification.py
