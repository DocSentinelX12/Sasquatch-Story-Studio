name: GPU Verification Contract Tests

on:
  push:
    branches:
      - elastic-multi-provider-compute-fabric-impl

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile verification modules and wrappers
        run: python -m compileall -q studio/gpu_runtime_verification.py studio/nccl_runtime_verification.py studio/gpu_direct_verification.py scripts/verify_gpu_runtime.py scripts/verify_nccl_runtime.py scripts/verify_gpu_direct.py
      - name: Validate real GPU workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/gpu-runtime-verification.yml', encoding='utf-8'))"
      - name: Run GPU verification contract tests
        run: python -m pytest -q tests/test_gpu_runtime_verification.py
      - name: Run complete test suite
        run: python -m pytest -q
