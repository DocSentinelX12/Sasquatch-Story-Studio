name: Elastic Fabric Topology Verification
on:
  push:
    branches:
      - elastic-multi-provider-compute-fabric-impl
permissions:
  contents: read
jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run fabric topology and scheduler tests
        run: python -m pytest -q tests/test_fabric_topology.py tests/test_fabric_scheduler.py
