name: GPU Capability TDD Focused Verification

on:
  push:
    branches:
      - gpu-capability-architecture

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run GPU capability regression suite
        run: python -m pytest -q tests/test_gpu_telemetry.py tests/test_gpu_capabilities.py tests/test_gpu_capability_placement.py tests/test_gpu_scheduler.py tests/test_gpu_aware_scheduler.py tests/test_distributed_gpu_scheduler.py tests/test_distributed_gpu.py tests/test_worker_registry_gpu_persistence.py tests/test_gpu_worker_agent.py tests/test_gpu_worker_agent_remote.py
