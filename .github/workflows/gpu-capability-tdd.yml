name: GPU Capability TDD Focused Verification

on:
  push:
    branches:
      - gpu-capability-architecture

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run focused GPU telemetry tests
        run: python -m pytest -q tests/test_gpu_infrastructure.py tests/test_gpu_telemetry.py
      - name: Run GPU worker persistence integration tests
        run: python -m pytest -q tests/test_gpu_worker_agent.py tests/test_gpu_worker_agent_remote.py tests/test_worker_registry_gpu_persistence.py
