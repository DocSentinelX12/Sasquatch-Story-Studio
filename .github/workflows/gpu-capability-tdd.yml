name: GPU Capability TDD Focused Verification

on:
  push:
    branches:
      - gpu-capability-architecture

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run capability contract tests
        run: python -m pytest -q tests/test_gpu_capabilities.py tests/test_hardware_requirements.py
      - name: Run capability evidence integration tests
        run: python -m pytest -q tests/test_nccl_evidence.py tests/test_gpu_infrastructure.py tests/test_worker_registry_gpu_persistence.py
