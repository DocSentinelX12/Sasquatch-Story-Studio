name: Elastic Fabric Full Repository Verification

on:
  push:
    branches:
      - elastic-multi-provider-compute-fabric-impl

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and test tooling
        run: |
          python -m pip install -e .
          python -m pip install pytest
          python -m pip check
      - name: Run full repository test suite
        run: python -m pytest -q
