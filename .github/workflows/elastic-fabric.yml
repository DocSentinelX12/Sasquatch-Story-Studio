name: Elastic Multi-Provider Compute Fabric

on:
  push:
    branches:
      - elastic-multi-provider-compute-fabric-impl
  workflow_dispatch:
    inputs:
      gpu_direct_command:
        description: "Configured physical GPU-direct probe command. It must print the success marker on verified success."
        required: true
        type: string
      success_marker:
        description: "Exact success marker emitted by the GPU-direct probe."
        required: false
        default: "GPU_DIRECT_VERIFIED"
        type: string

permissions:
  contents: read

concurrency:
  group: elastic-fabric-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  verify:
    name: Install engines, verify fabric contracts, and run regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Install project and verify dependencies
        run: |
          python -m pip install -e .
          python -m pip check

      - name: Install all core studio engines before tests
        shell: bash
        run: |
          set -euo pipefail
          for engine in blender opentoonz rhubarb-lip-sync piper comfyui wan2.1 wan2.2 ltx-video ace-step-1.5; do
            echo "=== Installing $engine ==="
            python scripts/install_engine.py "$engine"
          done

      - name: Install and verify Hugging Face Hub before tests
        run: python scripts/install_huggingface.py

      - name: Compile verification modules and wrappers
        run: |
          python -m compileall -q             studio/gpu_runtime_verification.py             studio/nccl_runtime_verification.py             studio/gpu_direct_verification.py             scripts/verify_gpu_runtime.py             scripts/verify_nccl_runtime.py             scripts/verify_gpu_direct.py

      - name: Validate Elastic Fabric workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/elastic-fabric.yml', encoding='utf-8'))"

      - name: Run GPU verification contract tests
        run: python -m pytest -q tests/test_gpu_runtime_verification.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Validate packaging
        run: python -m pip install --no-deps -e .

      - name: Install real Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1

      - name: Verify Blender by rendering a real frame
        run: python3 scripts/verify_blender_runtime.py

      - name: Verify real Piper voice runtime
        run: python3 scripts/verify_piper_runtime.py

      - name: Publish real engine runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: elastic-fabric-real-engine-runtime-evidence
          path: |
            blender-runtime-evidence.json
            blender-runtime-render.png
            blender-runtime-source.blend
            blender-runtime-artifacts/**
            piper-runtime-evidence.json
            piper-runtime.wav
            piper-runtime-artifacts-evidence/**
          if-no-files-found: error

      - name: Publish engine installation evidence
        uses: actions/upload-artifact@v6
        with:
          name: elastic-fabric-engine-installation-evidence
          path: |
            engine-installations/**/installation-evidence.json
          if-no-files-found: error

  physical-gpu:
    name: Physical CUDA, NCCL, and GPU-direct verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify real CUDA runtime
        run: python scripts/verify_gpu_runtime.py --output gpu-runtime-evidence.json

      - name: Verify real NCCL runtime
        run: python scripts/verify_nccl_runtime.py --output nccl-runtime-evidence.json

      - name: Verify real GPU-direct path
        env:
          GPU_DIRECT_COMMAND: ${{ inputs.gpu_direct_command }}
          GPU_DIRECT_MARKER: ${{ inputs.success_marker }}
        run: |
          python scripts/verify_gpu_direct.py             --command "$GPU_DIRECT_COMMAND"             --success-marker "$GPU_DIRECT_MARKER"             --output gpu-direct-evidence.json

      - name: Upload physical GPU evidence
        uses: actions/upload-artifact@v6
        with:
          name: elastic-fabric-real-gpu-runtime-evidence
          path: |
            gpu-runtime-evidence.json
            nccl-runtime-evidence.json
            gpu-direct-evidence.json
          if-no-files-found: error
