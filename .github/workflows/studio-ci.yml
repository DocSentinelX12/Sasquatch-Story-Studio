name: Sasquatch Story Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Install real Blender engine
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Verify Blender by rendering a real frame
        run: python3 scripts/verify_blender_runtime.py
      - name: Publish real Blender evidence
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-evidence
          path: |
            blender-runtime-evidence.json
            blender-runtime-render.png
            blender-runtime-source.blend
            blender-runtime-artifacts/**
          if-no-files-found: error
