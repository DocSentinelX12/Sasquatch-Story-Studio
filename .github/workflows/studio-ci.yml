name: Sasquatch Story Studio CI

on:
  workflow_run:
    workflows: ["Install All Studio Engines"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Triggering commit mismatch: expected $EXPECTED_SHA, checked out $actual_sha"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test tooling and project dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Install real Blender engine
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1
      - name: Verify Blender by rendering a real frame
        run: python3 scripts/verify_blender_runtime.py
      - name: Verify real Piper voice runtime
        run: python3 scripts/verify_piper_runtime.py
      - name: Publish real runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: real-engine-runtime-evidence
          path: |
            blender-runtime-evidence.json
            blender-runtime-render.png
            blender-runtime-source.blend
            blender-runtime-artifacts/**
            piper-runtime-evidence.json
            piper-runtime.wav
            piper-runtime-artifacts-evidence/**
          if-no-files-found: error
