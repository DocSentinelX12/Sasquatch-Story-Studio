name: Cross-Layer Fabric Integration Verification

on:
  push:
    branches:
      - elastic-multi-provider-compute-fabric-impl

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elastic-multi-provider-compute-fabric-impl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_compute_fabric.py tests/test_distributed_gpu.py tests/test_fabric_scheduler.py tests/test_worker_registry.py
