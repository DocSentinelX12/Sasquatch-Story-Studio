name: Install Wan2.2

on:
  workflow_run:
    workflows: ["Install All Studio Engines"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify source integration
        run: python scripts/install_wan22.py
      - name: Run targeted Wan2.2 contract tests
        run: python -m pip install pytest && python -m pytest -q tests/test_wan22_runtime.py
      - name: Upload installation evidence
        uses: actions/upload-artifact@v4
        with:
          name: wan2-2-installation-evidence
          path: engine-installations/wan2.2/installation-evidence.json
