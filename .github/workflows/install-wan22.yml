name: Install Wan2.2

on:
  push:
    branches: [main]
    paths:
      - "scripts/install_wan22.py"
      - "studio/wan22_runtime.py"
      - "studio/engine_registry.py"
      - ".github/workflows/install-wan22.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify source integration
        run: python scripts/install_wan22.py
      - name: Run targeted Wan2.2 contract tests
        run: python -m pip install pytest && python -m pytest -q tests/test_wan22_runtime.py
      - name: Upload installation evidence
        uses: actions/upload-artifact@v4
        with:
          name: wan2-2-installation-evidence
          path: engine-installations/wan2.2/installation-evidence.json
