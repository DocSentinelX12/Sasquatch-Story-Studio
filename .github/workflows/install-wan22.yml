name: Install Wan2.2

on:
  workflow_run:
    workflows: ["Install All Studio Engines"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Triggering commit mismatch: expected $EXPECTED_SHA, checked out $actual_sha"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install and verify source integration
        run: python scripts/install_wan22.py
      - name: Run targeted Wan2.2 contract tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pip check
          python -m pytest -q tests/test_wan22_runtime.py
      - name: Upload installation evidence
        uses: actions/upload-artifact@v6
        with:
          name: wan2-2-installation-evidence
          path: engine-installations/wan2.2/installation-evidence.json
          if-no-files-found: error
