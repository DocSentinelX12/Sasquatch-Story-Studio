name: Fabric Communication Focused Verification

on:
  push:
    branches:
      - elastic-multi-provider-compute-fabric-impl

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engines and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest
      - name: Focused fabric communication tests
        run: python -m pytest -q tests/test_fabric_communication.py
