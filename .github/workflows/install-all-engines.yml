name: Install All Studio Engines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        engine:
          - blender
          - opentoonz
          - rhubarb-lip-sync
          - piper
          - comfyui
          - wan2.1
          - wan2.2
          - ltx-video
          - ace-step-1.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure OpenToonz libtiff compatibility
        if: matrix.engine == 'opentoonz'
        run: echo "CXXFLAGS=-include $GITHUB_WORKSPACE/scripts/opentoonz_libtiff_compat.h ${CXXFLAGS:-}" >> "$GITHUB_ENV"
      - name: Install engine from official source and record evidence
        run: python scripts/install_engine.py "${{ matrix.engine }}"
      - name: Publish installation evidence
        uses: actions/upload-artifact@v4
        with:
          name: engine-install-${{ matrix.engine }}
          path: engine-installations/${{ matrix.engine }}/installation-evidence.json
          if-no-files-found: error
