name: Model Adapter Targeted Verification

on:
  workflow_run:
    workflows: ["Install All Studio Engines"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  targeted:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Triggering commit mismatch: expected $EXPECTED_SHA, checked out $actual_sha"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test tooling and project dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pip check
      - name: Run model adapter and runtime evidence tests
        run: >-
          python -m pytest -q
          tests/test_engines.py
          tests/test_runtime_verification.py
          tests/test_engine_adapters.py
          tests/test_hunyuan_runtime.py
          tests/test_skyreels_v3_runtime.py
          tests/test_cogvideox15_i2v_runtime.py
