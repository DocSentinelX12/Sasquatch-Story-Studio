[project]
name = "sasquatch-story-studio"
version = "0.1.0"
description = "Local-first, story-faithful animation production pipeline"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=1.0,<2",
]

[tool.setuptools]
packages = ["studio"]

[project.scripts]
sasquatch-studio = "studio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
